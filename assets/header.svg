<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="SACHINTHA — cyber banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#050A14"/>
      <stop offset="1" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="2" y="2" width="1196" height="336" rx="18"/></clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="336" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.35;0.65;0.35" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#clip)">
    <rect x="2" y="2" width="1196" height="336" fill="url(#grid)"/>
    <ellipse cx="600" cy="168" rx="470" ry="125" fill="#00F0FF" opacity="0.055"/>
    <ellipse cx="600" cy="168" rx="280" ry="75" fill="#00FF88" opacity="0.045"/>
    <ellipse cx="255" cy="82" rx="240" ry="95" fill="#00FF88" opacity="0.04"/>

    <!-- rising particles -->
    <circle cx="150" cy="260" r="2.6" fill="#00F0FF" opacity="0.6">
      <animate attributeName="cy" values="330;80;330" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.75;0.05" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="120" r="1.8" fill="#00FF88" opacity="0.5">
      <animate attributeName="cy" values="300;60;300" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.6;0.05" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="200" r="2.2" fill="#00FF88" opacity="0.6">
      <animate attributeName="cy" values="320;90;320" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.7;0.05" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="90" r="2.4" fill="#00F0FF" opacity="0.5">
      <animate attributeName="cy" values="330;110;330" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.65;0.05" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="300" r="1.7" fill="#00F0FF" opacity="0.5">
      <animate attributeName="cy" values="335;150;335" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.55;0.04" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- scan sweep -->
    <rect x="2" y="0" width="1196" height="70" fill="url(#scanGrad)" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 -90; 0 350" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#soft2)">
    <path d="M30 76 V40 Q30 30 40 30 H76"/>
    <path d="M1170 76 V40 Q1170 30 1160 30 H1124"/>
    <path d="M30 264 V300 Q30 310 40 310 H76"/>
    <path d="M1170 264 V300 Q1170 310 1160 310 H1124"/>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
    <!-- top chips -->
    <rect x="96" y="44" width="150" height="34" rx="8" fill="#00F0FF" opacity="0.08" stroke="#00F0FF" stroke-opacity="0.55"/>
    <text x="171" y="67" text-anchor="middle" font-size="19" fill="#00F0FF">$ whoami</text>

    <rect x="944" y="44" width="160" height="34" rx="8" fill="#00FF88" opacity="0.08" stroke="#00FF88" stroke-opacity="0.55"/>
    <circle cx="962" cy="61" r="3.5" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1032" y="66" text-anchor="middle" font-size="16" fill="#00FF88">KEGALLE // LK</text>

    <!-- title with glitch ghosts -->
    <text x="600" y="176" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="16" fill="#00F0FF" opacity="0.55" filter="url(#soft2)">SACHINTHA
      <animate attributeName="opacity" values="0;0;0.5;0;0.55;0;0" keyTimes="0;0.665;0.672;0.678;0.685;0.69;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-3 2;0 0" keyTimes="0;0.665;0.672;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="176" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="16" fill="#00FF88" opacity="0.5" filter="url(#soft2)">SACHINTHA
      <animate attributeName="opacity" values="0;0;0.45;0;0;0.4;0;0" keyTimes="0;0.32;0.327;0.334;0.71;0.717;0.724;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;3 -2;0 0;0 0;-3 1;0 0" keyTimes="0;0.32;0.327;0.334;0.71;0.717;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="176" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="16" fill="#F0F6FC" filter="url(#soft)">
      SACHINTHA
      <animate attributeName="opacity" values="1;1;0.6;1;1;0.75;1" keyTimes="0;0.7;0.72;0.74;0.9;0.92;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- underline -->
    <rect x="330" y="198" width="540" height="4" rx="2" fill="url(#neonGrad)" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle r="5" fill="#00FF88" filter="url(#soft2)">
      <animate attributeName="cx" values="330;870" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="246" text-anchor="middle" font-size="27" letter-spacing="8" fill="#00FF88" filter="url(#soft2)">STUDENT // SELF-TAUGHT DEVELOPER</text>

    <!-- status bar -->
    <text x="96" y="290" font-size="20" fill="#8B949E">$ status: ./build_the_future.sh — running</text>
    <rect x="624" y="270" width="12" height="22" fill="#00F0FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <circle cx="1010" cy="283" r="4" fill="#00FF88" filter="url(#soft2)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1024" y="289" font-size="15" fill="#00FF88" opacity="0.85">SYS.CYBER_v3</text>
  </g>
</svg>
