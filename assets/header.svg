<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SACHINTHA cyber banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#050A14"/>
      <stop offset="1" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="2" y="2" width="1196" height="316" rx="18"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bgGrad)" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <rect x="2" y="2" width="1196" height="316" fill="url(#grid)"/>
    <ellipse cx="600" cy="155" rx="430" ry="115" fill="#00F0FF" opacity="0.06"/>
    <ellipse cx="600" cy="155" rx="250" ry="70" fill="#00FF88" opacity="0.05"/>

    <circle cx="170" cy="250" r="2.6" fill="#00F0FF" opacity="0.6">
      <animate attributeName="cy" values="265;140;265" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="120" r="2.2" fill="#00FF88" opacity="0.6">
      <animate attributeName="cy" values="110;240;110" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="260" r="2" fill="#00F0FF" opacity="0.5">
      <animate attributeName="cy" values="270;160;270" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="13s" repeatCount="indefinite"/>
    </circle>

    <rect x="2" y="0" width="1196" height="70" fill="url(#scanGrad)" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" values="0 -90; 0 330" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#soft)">
    <path d="M30 72 V40 Q30 30 40 30 H72"/>
    <path d="M1170 72 V40 Q1170 30 1160 30 H1128"/>
    <path d="M30 248 V280 Q30 290 40 290 H72"/>
    <path d="M1170 248 V280 Q1170 290 1160 290 H1128"/>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
    <rect x="96" y="44" width="150" height="34" rx="8" fill="#00F0FF" opacity="0.08" stroke="#00F0FF" stroke-opacity="0.55"/>
    <text x="171" y="67" text-anchor="middle" font-size="19" fill="#00F0FF">$ whoami</text>

    <rect x="954" y="44" width="150" height="34" rx="8" fill="#00FF88" opacity="0.08" stroke="#00FF88" stroke-opacity="0.55"/>
    <text x="1029" y="66" text-anchor="middle" font-size="16" fill="#00FF88">KEGALLE // LK</text>

    <text x="600" y="170" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="16" fill="#F0F6FC" filter="url(#soft)">SACHINTHA
      <animate attributeName="opacity" values="1;1;0.55;1;1;0.8;1" keyTimes="0;0.7;0.72;0.74;0.9;0.92;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <rect x="330" y="192" width="540" height="4" rx="2" fill="url(#neonGrad)" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="240" text-anchor="middle" font-size="27" letter-spacing="8" fill="#00FF88" filter="url(#soft)">STUDENT // SELF-TAUGHT DEVELOPER</text>

    <text x="96" y="284" font-size="20" fill="#8B949E">$ status: ./build_the_future.sh — running</text>
    <rect x="580" y="264" width="12" height="22" fill="#00F0FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="1104" y="284" text-anchor="end" font-size="16" fill="#00F0FF" opacity="0.6">SYS.CYBER_v2</text>
  </g>
</svg>
