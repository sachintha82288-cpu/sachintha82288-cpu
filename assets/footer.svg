<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Encrypted session footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A14"/>
      <stop offset="1" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="fneon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <pattern id="fgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#00F0FF" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="fsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="fclip">
      <rect x="2" y="2" width="1196" height="186" rx="18"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="186" rx="18" fill="url(#fbg)" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="2"/>
  <g clip-path="url(#fclip)">
    <rect x="2" y="2" width="1196" height="186" fill="url(#fgrid)"/>
  </g>

  <rect x="200" y="30" width="800" height="2" rx="1" fill="url(#fneon)" opacity="0.6"/>
  <circle r="5" fill="#00FF88" filter="url(#fsoft)">
    <animateMotion path="M200 31 L1000 31" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="600" y="92" font-size="32" font-weight="700" letter-spacing="4" fill="#00F0FF" filter="url(#fsoft)">./session_secure — EOF</text>
    <circle cx="474" cy="124" r="7" fill="#00FF88" filter="url(#fsoft)">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="131" font-size="18" letter-spacing="4" fill="#00FF88">SYSTEM ONLINE</text>
    <text x="600" y="164" font-size="15" letter-spacing="2" fill="#8B949E">sachintha // kegalle // lk</text>
  </g>
</svg>
