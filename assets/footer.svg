<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Encrypted session footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A14"/>
      <stop offset="1" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="fneon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <pattern id="fgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#00F0FF" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="fsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fclip"><rect x="2" y="2" width="1196" height="226" rx="18"/></clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="226" rx="18" fill="url(#fbg)" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- data streams, flowing; the padlock guards the middle of the line -->
  <g clip-path="url(#fclip)">
    <rect x="2" y="2" width="1196" height="226" fill="url(#fgrid)"/>
    <line x1="60" y1="56" x2="1140" y2="56" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="26 22 8 30 14 24">
      <animate attributeName="stroke-dashoffset" from="0" to="-248" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="196" x2="1140" y2="196" stroke="#00FF88" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="18 26 34 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- padlock sitting on the stream -->
  <g transform="translate(600 56)">
    <path d="M -13 6 V -6 a 13 13 0 0 1 26 0 V 6" fill="none" stroke="#00FF88" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="d" values="M -13 6 V -6 a 13 13 0 0 1 26 0 V 6; M -13 6 V -6 a 13 13 0 0 1 26 0 V -1; M -13 6 V -6 a 13 13 0 0 1 26 0 V 6" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <rect x="-23" y="6" width="46" height="36" rx="7" fill="#050A14" stroke="#00F0FF" stroke-width="3.5"/>
    <circle cx="0" cy="20" r="4.5" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="24.5" x2="0" y2="33" stroke="#00FF88" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="600" y="120" font-size="30" font-weight="700" letter-spacing="4" fill="#00F0FF" filter="url(#fsoft)">./stay_encrypted.sh — EOF</text>

    <circle cx="512" cy="152" r="6" fill="#00FF88" filter="url(#fsoft)">
      <animate attributeName="r" values="4.5;7.5;4.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="530" y="158" text-anchor="start" font-size="17" letter-spacing="4" fill="#00FF88">SYSTEM ONLINE</text>
  </g>

  <rect x="200" y="182" width="800" height="2" rx="1" fill="url(#fneon)" opacity="0.5"/>

  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
    <text x="60" y="216" font-size="15" letter-spacing="2" fill="#8B949E">sachintha // kegalle // lk</text>
    <text x="1140" y="216" text-anchor="end" font-size="15" letter-spacing="2" fill="#8B949E">learn in silence — ship in public</text>
  </g>
</svg>
