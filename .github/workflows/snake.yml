# Regenerates the contribution-snake animation (the "prey sequence") on the
# `output` branch, which the README references via raw.githubusercontent.com.
# Runs daily so the snake always crawls over the current contribution graph.

name: generate snake

on:
  schedule:
    - cron: "17 0 * * *" # daily 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00F0FF&color_dots=#0D1626,#0E4A57,#0F7C8C,#00C9A7,#00FF88
            dist/github-snake-dark.svg?color_snake=#00F0FF&color_dots=#0D1626,#0E4A57,#0F7C8C,#00C9A7,#00FF88

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
